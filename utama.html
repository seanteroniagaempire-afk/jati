    }

      font-family: 'Inter', sans-serif;
      color: #1F1B16;
      padding: 1rem 1rem 2rem 1rem;
    }

    .catalogue-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.9rem;
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    .furniture-row {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 0.9rem;
      background: #FFFFFF;
      border-radius: 24px;
      overflow: hidden;

      border: 1px solid #EFEAE3;
      animation: fadeInUp 0.4s ease;
    }

    @keyframes fadeInUp {

      to { opacity: 1; transform: translateY(0); }
    }

    .image-col {
      position: relative;
      background: #F1EDE6;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-col img {

    }
    .image-col:active img {

    }

    .details-col {

    }
    .item-type {

      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;

      margin-bottom: 0.5rem;
      width: fit-content;
    }
    .item-name {

      line-height: 1.25;
    }

      margin: 0.3rem 0 0.25rem 0;
    }
    .item-desc {
      font-size: 0.7rem;
      color: #6E6256;

      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-code {
      font-size: 0.6rem;
      font-family: 'SF Mono', 'Fira Code', monospace;

      padding: 0.2rem 0.5rem;

    }
    .product-code i {

    }
    
    .button-group {

    }
    .buy-btn, .see-more-btn {

      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;

      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;

      text-decoration: none;
    }
    .buy-btn {

</head>

    { id: 19, name: "Set Kobra JATI Diamond", category: "set meja kerusi", typeLabel: "Set Meja Kerusi", price: 2819, description: "Meja kopi jati beserta kerusi set.", image: "https://i.ibb.co/GQhhF7t8/id19.png", buyLink: "https://s.shopee.com.my/4VZs5DVHMo", releaseDate: "2026-05-24T11:00:27" },
    { id: 20, name: "Set Meja Kerusi Kayu Jati Ukir", category: "set meja kerusi", typeLabel: "Set Meja Kerusi", price: 2810, description: "Ukiran jati. Meja kopi dan set kerusi.", image: "https://i.ibb.co/F4qtFCwZ/id20.png", buyLink: "https://s.shopee.com.my/4Ax1gnZ7pP", releaseDate: "2026-05-24T11:00:28" },

  // Fungsi generate product code berdasarkan tarikh release (format: JTI-YYYYMMDD-HHMMSS)
  function generateProductCode(isoDateString) {
    const date = new Date(isoDateString);
    if (isNaN(date.getTime())) return "JTI-00000000-000000";
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const seconds = String(date.getSeconds()).padStart(2, '0');
    return `JTI-${year}${month}${day}-${hours}${minutes}${seconds}`;
  }
  
  // augment setiap item dengan productCode dan releaseTimestamp
  const fullFurnitureList = furnitureRaw.map(item => ({
    ...item,
    productCode: generateProductCode(item.releaseDate),
    releaseTimestamp: new Date(item.releaseDate).getTime()
  }));
  
  // State untuk pagination, sorting, kategori
  let visibleCount = 5;
  const PAGE_STEP = 5;
  let currentSort = "latest";
  let currentCategory = "all";
  let workingList = [...fullFurnitureList];
  
  function updateWorkingList() {
    let filtered = [...fullFurnitureList];
    if (currentCategory !== "all") {
      filtered = filtered.filter(item => item.category === currentCategory);
    }
    if (currentSort === "low-high") {
      filtered.sort((a, b) => a.price - b.price);
    } else if (currentSort === "high-low") {
      filtered.sort((a, b) => b.price - a.price);
    } else if (currentSort === "latest") {
      filtered.sort((a, b) => b.releaseTimestamp - a.releaseTimestamp);
    }
    workingList = filtered;
  }
  
  function formatPrice(price) {
    return 'RM ' + price.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  function getRelativeDateLabel(releaseDate) {
    const date = new Date(releaseDate);
    if (isNaN(date.getTime())) return "tarikh tidak tersedia";
    return date.toLocaleDateString('ms-MY', { year: 'numeric', month: 'long', day: 'numeric' });
  }
  
  // Render katalog utama
  function renderCatalogue() {
    const gridContainer = document.getElementById("catalogueGrid");
    if (!gridContainer) return;
    
    updateWorkingList();
    const itemsToShow = workingList.slice(0, visibleCount);
    const totalItems = workingList.length;
    
    const statsSpan = document.getElementById("itemStats");
    if (statsSpan) {
      let sortText = "";
      if (currentSort === "latest") sortText = "📅 Terkini dahulu";
      else if (currentSort === "low-high") sortText = "💰 Harga ↑";
      else sortText = "💰 Harga ↓";
      const categoryName = currentCategory === "all" ? "Semua Kategori" : 
                           (currentCategory === "kerusi" ? "Kerusi" :
                            (currentCategory === "kabinet" ? "Kabinet/Almari" : "Set Meja Kerusi"));
      statsSpan.innerHTML = `<i class="fas fa-chair"></i> ${itemsToShow.length} daripada ${totalItems} item · ${sortText} · ${categoryName}`;
    }
    
    if (itemsToShow.length === 0) {
      gridContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem; background:#F9F5EF; border-radius:40px;">✨ Tiada perabot untuk kategori ini. Cuba pilih kategori lain ✨</div>`;
      document.getElementById("loadMoreContainer").classList.add("hidden");
      document.getElementById("endMessage").classList.remove("show");
      return;
    }
    
    let rowsHtml = "";
    for (let item of itemsToShow) {
      // Pilih ikon berdasarkan kategori asal
      let categoryIcon = "fa-tag";
      if (item.category === "kerusi") categoryIcon = "fa-couch";
      else if (item.category === "kabinet") categoryIcon = "fa-archive";
      else if (item.category === "set meja kerusi") categoryIcon = "fa-utensils";
      
      // Badge baru jika kurang 60 hari (berdasarkan tarikh release)
      const daysSinceRelease = (Date.now() - new Date(item.releaseDate).getTime()) / (1000 * 3600 * 24);
      const newBadge = daysSinceRelease < 60 ? ' <span style="background:#B47C48; color:white; font-size:0.55rem; padding:0.1rem 0.5rem; border-radius:20px; margin-left:6px;">BARU</span>' : '';
      
      rowsHtml += `
        <div class="furniture-row" data-id="${item.id}">
          <div class="image-col" data-img="${item.image}" data-name="${item.name}">
            <img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.src='https://placehold.co/600x400?text=Jati+Murah'">
          </div>
          <div class="details-col">
            <div>
              <span class="item-type"><i class="fas ${categoryIcon}"></i> ${item.typeLabel}</span>
              <div class="item-name">${escapeHtml(item.name)}${newBadge}</div>
              <div class="item-price">${formatPrice(item.price)}</div>
              <div class="item-desc">${escapeHtml(item.description)}</div>
              <div class="product-code"><i class="fas fa-qrcode"></i> ${escapeHtml(item.productCode)}</div>
              <div style="font-size:0.55rem; color:#B8A996; margin-top:-0.3rem; margin-bottom:0.3rem;"><i class="fas fa-calendar-alt"></i> dikeluarkan ${getRelativeDateLabel(item.releaseDate)}</div>
            </div>
            <div class="button-group">
              <button class="buy-btn" data-buy-link="${item.buyLink}" data-item-name="${escapeHtml(item.name)}">
                <i class="fas fa-bag-shopping"></i> Beli
              </button>
              <button class="see-more-btn" data-see-link="${item.buyLink}" data-item-name="${escapeHtml(item.name)}">
                <i class="fas fa-eye"></i> Info
              </button>
            </div>
          </div>
        </div>
      `;
    }
    gridContainer.innerHTML = rowsHtml;
    
    // Image popup modal untuk klik pada gambar
    document.querySelectorAll('.image-col').forEach(col => {
      col.addEventListener('click', (e) => {
        e.stopPropagation();
        const img = col.querySelector('img');
        if (img && img.src) openModal(img.src);
        else {
          const dataImg = col.getAttribute('data-img');
          if (dataImg) openModal(dataImg);
        }
      });
    });
    
    // Butang "Beli Sekarang"
    document.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const link = btn.getAttribute('data-buy-link');
        const itemName = btn.getAttribute('data-item-name') || 'item';
        if (link && link !== "#") {
          window.open(link, '_blank');
        } else {
          alert(`🛒 "${itemName}" – Sila layari laman Shopee rasmi kami.`);
        }
      });
    });
    
    // Butang "Lihat Lagi" (buka pautan yang sama untuk maklumat lanjut)
    document.querySelectorAll('.see-more-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const link = btn.getAttribute('data-see-link');
        const itemName = btn.getAttribute('data-item-name') || 'item';
        if (link && link !== "#") {
          window.open(link, '_blank');
        } else {
          alert(`🔍 "${itemName}" – Maklumat lanjut di kedai online.`);
        }
      });
    });
    
    // Manage load more button & end message
    const loadMoreContainer = document.getElementById("loadMoreContainer");
    const endMessageDiv = document.getElementById("endMessage");
    if (visibleCount >= totalItems) {
      loadMoreContainer.classList.add("hidden");
      if (totalItems > 0) endMessageDiv.classList.add("show");
      else endMessageDiv.classList.remove("show");
    } else {
      loadMoreContainer.classList.remove("hidden");
      endMessageDiv.classList.remove("show");
      const remaining = totalItems - visibleCount;
      const loadBtn = document.getElementById("loadMoreBtn");
      if (loadBtn) {
        loadBtn.innerHTML = `<i class="fas fa-arrow-down"></i> Muat Lagi (${Math.min(PAGE_STEP, remaining)} lagi)`;
      }
    }
  }
  
  function loadMoreItems() {
    updateWorkingList();
    const total = workingList.length;
    if (visibleCount < total) {
      visibleCount = Math.min(visibleCount + PAGE_STEP, total);
      renderCatalogue();
      setTimeout(() => {
        const lastRow = document.querySelector('.furniture-row:last-child');
        if (lastRow) lastRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    } else {
      document.getElementById("loadMoreContainer").classList.add("hidden");
      document.getElementById("endMessage").classList.add("show");
    }
  }
  
  function resetAndRender() {
    visibleCount = 5;
    renderCatalogue();
  }
  
  // Modal image functions
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImage");
  const closeModalBtn = document.querySelector(".close-modal");
  
  function openModal(imgSrc) {
    if (modal && modalImg) {
      modalImg.src = imgSrc;
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
    }
  }
  function closeModal() {
    if (modal) {
      modal.style.display = "none";
      document.body.style.overflow = "auto";
    }
  }
  if (closeModalBtn) closeModalBtn.addEventListener("click", closeModal);
  window.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && modal && modal.style.display === "flex") closeModal(); });
  
  // Initialize sorting & category filters
  function initSorting() {
    const sortBtns = document.querySelectorAll('[data-sort]');
    const updateSortActive = () => {
      sortBtns.forEach(btn => {
        if (btn.getAttribute('data-sort') === currentSort) btn.classList.add("active");
        else btn.classList.remove("active");
      });
    };
    sortBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const sortValue = btn.getAttribute("data-sort");
        if (sortValue && ["latest","low-high","high-low"].includes(sortValue)) {
          currentSort = sortValue;
          updateSortActive();
          resetAndRender();
        }
      });
    });
    
    const catBtns = document.querySelectorAll('[data-cat]');
    const setActiveCategory = (selected) => {
      catBtns.forEach(btn => {
        if (btn.getAttribute('data-cat') === selected) btn.classList.add("active");
        else btn.classList.remove("active");
      });
    };
    catBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        const catValue = btn.getAttribute("data-cat");
        if (catValue) {
          currentCategory = catValue;
          setActiveCategory(catValue);
          resetAndRender();
        }
      });
    });
    updateSortActive();
    setActiveCategory("all");
  }
  
  document.getElementById("loadMoreBtn")?.addEventListener("click", loadMoreItems);
  initSorting();
  renderCatalogue();
</script>
</body>
</html>
